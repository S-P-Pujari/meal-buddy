<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .username {
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
            text-align: right;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #ff6b35;
            color: white;
            padding: 14px;
            text-align: center;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #fff5f0;
        }

        img {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .checkout {
            text-align: right;
            margin-top: 20px;
        }

        .checkout input {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .checkout input:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="username">
            Welcome, {{ username }}
        </div>

        <table>
            <thead>
                <tr>
                    <th>Item Image</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody>
                {% for item in itemList %}
                    <tr>
                        <td>
                            <img src="{{ item.picture }}" alt="{{ item.name }}">
                        </td>
                        <td>{{ item.name }}</td>
                        <td>{{ item.description }}</td>
                        <td>₹{{ item.price }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <h2>Total Price: ₹{{ total_price }}</h2>

        <div class="checkout">
            <form action="{% url 'checkout' username %}">
                <input type="submit" value="CHECK OUT">
            </form>
        </div>

    </div>

</body>
</html>
