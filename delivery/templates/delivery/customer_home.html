
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h3 {
            text-align: center;
            color: #ff6b35;
            font-size: 28px;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #ff6b35;
            color: white;
            padding: 14px;
            text-align: center;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #fff5f0;
        }

        img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .menu-link {
            display: inline-block;
            padding: 9px 16px;
            background-color: #ff6b35;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .menu-link:hover {
            background-color: #e85b2a;
        }
    </style>
</head>

<body>

    <div class="container">

        <h3>Welcome {{ username }}!</h3>

        <table>
            <thead>
                <tr>
                    <th>Restaurant Name</th>
                    <th>Picture</th>
                    <th>Cuisine</th>
                    <th>Rating</th>
                    <th>Operations</th>
                </tr>
            </thead>

            <tbody>
                {% for r in restaurantList %}
                    <tr>
                        <td>{{ r.name }}</td>

                        <td>
                            <img src="{{ r.picture }}" alt="{{ r.name }}">
                        </td>

                        <td>{{ r.cuisine }}</td>

                        <td>⭐ {{ r.rating }}</td>

                        <td>
                            <a class="menu-link"
                               href="{% url 'view_menu' r.id username %}">
                                View Menu
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</body>
</html>
