<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed</title>


<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 400px;
        margin: 150px auto;
        background-color: white;
        padding: 40px;
        text-align: center;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    h3 {
        color: #dc3545;
        font-size: 28px;
        margin-bottom: 25px;
    }

    p {
        color: #666;
        font-size: 16px;
        margin-bottom: 25px;
    }

    a {
        display: inline-block;
        padding: 11px 20px;
        background-color: #ff6b35;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }

    a:hover {
        background-color: #e85b2a;
    }
</style>


</head>

<body>


<div class="container">
    <h3>Login Failed!</h3>

    <p>Invalid username or password.</p>

    <a href="{% url 'open_signin' %}">Try Again</a>
</div>


</body>
</html>
