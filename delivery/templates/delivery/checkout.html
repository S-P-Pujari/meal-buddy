<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #ff6b35;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #444;
            font-size: 20px;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #ff6b35;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #fff5f0;
        }

        .total {
            text-align: right;
            color: #333;
            margin-top: 25px;
            font-size: 22px;
        }

        .payment {
            text-align: center;
            margin-top: 30px;
        }

        #rzp-button {
            background-color: #ff6b35;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #rzp-button:hover {
            background-color: #e85b2a;
        }

        .error {
            background-color: #ffe5e5;
            color: red;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Checkout</h1>

        <h2>Welcome, {{ username }}</h2>

        {% if error %}

            <p class="error">{{ error }}</p>

        {% else %}

            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Price</th>
                    </tr>
                </thead>

                <tbody>
                    {% for item in cart_items %}
                    <tr>
                        <td>{{ item.name }}</td>
                        <td>₹{{ item.price }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <h3 class="total">Total: ₹{{ total_price }}</h3>

            <div class="payment">
                <button id="rzp-button">Pay with Razorpay</button>
            </div>

        {% endif %}

    </div>

    <script>
        var options = {
            "key": "{{ razorpay_key_id }}",
            "amount": "{{ total_price|floatformat:2|add:'0.00'|floatformat:2 }}00",
            "currency": "INR",
            "name": "Meal Buddy",
            "description": "Order Payment",
            "order_id": "{{ order_id }}",

            "handler": function (response) {
                alert("Payment Successful!");

                window.location.href = "{% url 'orders' username %}";
            },

            "prefill": {
                "name": "{{ username }}",
                "email": "customer@example.com",
                "contact": "9999999999"
            },

            "theme": {
                "color": "#528FF0"
            }
        };

        var rzp = new Razorpay(options);

        document.getElementById('rzp-button').onclick = function(e) {
            rzp.open();
            e.preventDefault();
        };
    </script>

</body>
</html>
