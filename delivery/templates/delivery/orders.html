<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>


<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 500px;
        margin: 100px auto;
        background-color: white;
        padding: 40px;
        text-align: center;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    }

    .success-icon {
        font-size: 55px;
        color: #28a745;
        margin-bottom: 10px;
    }

    h1 {
        color: #28a745;
        font-size: 28px;
        margin-bottom: 30px;
    }

    h2 {
        color: #333;
        font-size: 22px;
        margin-bottom: 10px;
    }

    .address {
        background-color: #f8f8f8;
        padding: 15px;
        border-radius: 8px;
        color: #555;
        font-size: 16px;
        margin-bottom: 25px;
    }

    .message {
        color: #666;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    a {
        display: inline-block;
        padding: 12px 22px;
        background-color: #ff6b35;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }

    a:hover {
        background-color: #e85b2a;
    }
</style>


</head>

<body>


<div class="container">

    <div class="success-icon">✓</div>

    <h1>Thank you for your order, {{ username }}!</h1>

    <h2>Delivery Address</h2>

    <div class="address">
        {{ customer.address }}
    </div>

    <p class="message">
        Your order will be delivered to this location shortly.
        Thank you for choosing Meal Mate!
    </p>

    {% if cart_items %}
        <a href="{% url 'customer_menu' cart_items.0.restaurant.id username %}">
            Back to Restaurants
        </a>
    {% else %}
        <a href="/">
            Back to Home
        </a>
    {% endif %}

</div>


</body>
</html>
