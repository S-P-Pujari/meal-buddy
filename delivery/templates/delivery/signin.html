<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>


<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 400px;
        margin: 120px auto;
        background-color: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    h3 {
        text-align: center;
        color: #ff6b35;
        font-size: 28px;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #444;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 11px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
    }

    input:focus {
        border-color: #ff6b35;
        outline: none;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #ff6b35;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background-color: #e85b2a;
    }
</style>


</head>

<body>


<div class="container">

    <h3>Sign In</h3>

    <form action="{% url 'signin' %}" method="post">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">SIGN IN</button>
    </form>

</div>


</body>
</html>
